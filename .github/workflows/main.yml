name: my-first-workflow
on: 
  push
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-22.04
    steps:
      - name: Running single command in job1
        run: echo "Hi this is my git hub workflow"
      - name: Checking os release for Github hosted runner
        run: cat /etc/os-release
      - name: calling sleep
        run: sleep 20
  job2:
    name: JOB2
    runs-on: ubuntu-22.04
    steps:
      - name: Check the Hostname for runner
        run: hostname
      - name: Running multiple commands
        run: | 
          echo "Hi from ashok"
          echo "Current time is 'date'"
          sleep 20
  job3:
    name: JOB3
    needs: job1
    runs-on: ubuntu-22.04
    steps:
      - name: Job with single dependency
        run: sleep 10
  job4:
    name: JOB4
    needs:  [job1, job2, job3]
    runs-on: ubuntu-22.04
    steps:
      - name: Job for multiplr depenedecies
        run: sleep 10
