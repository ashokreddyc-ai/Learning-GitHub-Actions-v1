name: my-first-workflow
on: 
  push:
    
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-22.04
    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step-2 Checkout
        uses: actions/checkout@v7
      - name: step-3 
        run: |
          echo 'pwd' >> myartifact.txt 
          ls -ltr
          hostname
      - name: Upload single file
        uses: actions/upload-artifact@v4
        with:
          name: single_file
          path: ./myartifact.txt 
